[package]
name = "rollback2025"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.8"
tokio = { version = "1.49.0", features = ["full"] }


# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.8.6", features = ["chrono", "postgres", "runtime-tokio", "tls-native-tls", "uuid"] }

# Logging & Tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }

# For accessing rsqlite databases
rqlite-rs = "0.6.2"
dotenv = "0.15.0"
thiserror = "2.0.18"
anyhow = "1.0.102"
